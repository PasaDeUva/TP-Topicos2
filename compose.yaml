services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: topicos
      POSTGRES_USER: topicos
      POSTGRES_PASSWORD: topicos
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U topicos -d topicos"]
      interval: 5s
      timeout: 5s
      retries: 10

  mock-service:
    build:
      context: ./backend/mock-service
    environment:
      DATABASE_URL: postgresql+psycopg://topicos:topicos@postgres:5432/topicos
    ports:
      - "8000:8000"
    volumes:
      - ./backend/mock-service:/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      postgres:
        condition: service_healthy

  backend-tests:
    build:
      context: ./backend
      dockerfile: Dockerfile.tests

  mock-app:
    build:
      context: ./frontend/mock-app
    ports:
      - "5173:5173"
    depends_on:
      mock-service:
        condition: service_started

volumes:
  postgres-data:
