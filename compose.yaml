services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: topicos
      POSTGRES_USER: topicos
      POSTGRES_PASSWORD: topicos
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U topicos -d topicos"]
      interval: 5s
      timeout: 5s
      retries: 10

  mock-service:
    build:
      context: ./backend/mock-service
    environment:
      DATABASE_URL: postgresql+psycopg://topicos:topicos@postgres:5432/topicos
    ports:
      - "8000:8000"
    volumes:
      - ./backend/mock-service:/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      postgres:
        condition: service_healthy

  backend-tests:
    build:
      context: ./backend
      dockerfile: Dockerfile.tests
    environment:
      IDENTITY_TEST_DATABASE_URL: postgresql+psycopg://identity:identity@identity-dev-db:5432/identity_test
      TEST_DATABASE_URL: postgresql+psycopg://events:events@events-db:5432/events_test
    depends_on:
      identity-test-db-init:
        condition: service_completed_successfully
      events-db:
        condition: service_healthy

  mock-app:
    build:
      context: ./frontend/mock-app
    ports:
      - "5173:5173"
    depends_on:
      mock-service:
        condition: service_started

  web-app:
    build:
      context: ./frontend/web-app
    environment:
      VITE_IDENTITY_ORIGIN: ${VITE_IDENTITY_ORIGIN:-}
    ports:
      - "${WEB_APP_HOST_PORT:-5174}:5174"
    depends_on:
      identity-service:
        condition: service_healthy

  events-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: events_db
      POSTGRES_USER: events
      POSTGRES_PASSWORD: events
    ports:
      - "5433:5432"
    volumes:
      - events-db-data:/var/lib/postgresql/data
      - ./backend/events-service/scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U events -d events_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  identity-dev-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: identity_db
      POSTGRES_USER: identity
      POSTGRES_PASSWORD: identity
    ports:
      - "${IDENTITY_DB_HOST_PORT:-5435}:5432"
    volumes:
      - identity-dev-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identity -d identity_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  identity-test-db-init:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: identity
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        set -eu;
        if [ "$(psql -h identity-dev-db -U identity -d postgres -Atqc
        "SELECT 1 FROM pg_database WHERE datname = 'identity_test'")" != "1" ]; then
        createdb -h identity-dev-db -U identity identity_test;
        fi
    depends_on:
      identity-dev-db:
        condition: service_healthy

  identity-service:
    build:
      context: ./backend/identity-service
    environment:
      IDENTITY_ENV: local
      IDENTITY_WEB_ALLOW_LOCAL_HTTP: ${IDENTITY_WEB_ALLOW_LOCAL_HTTP:-true}
      IDENTITY_WEB_ORIGINS: ${IDENTITY_WEB_ORIGINS:-http://localhost:5174}
      IDENTITY_WEB_CSRF_SECRET: ${IDENTITY_WEB_CSRF_SECRET:-}
      UVICORN_RELOAD: "true"
      PYTHONDONTWRITEBYTECODE: "1"
      WATCHFILES_FORCE_POLLING: ${IDENTITY_WATCHFILES_FORCE_POLLING:-true}
      DATABASE_URL: postgresql+psycopg://identity:identity@identity-dev-db:5432/identity_db
      JWT_PRIVATE_DIR: /keys/private
      JWT_PUBLIC_DIR: /keys/public
      JWT_ISSUER: ${IDENTITY_JWT_ISSUER:-identity-local}
      JWT_AUDIENCE: ${IDENTITY_JWT_AUDIENCE:-platform-local}
      ADMIN_EMAIL: ${IDENTITY_ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${IDENTITY_ADMIN_PASSWORD:-local-admin-password}
      SERVICE_CREDENTIALS_JSON: ${IDENTITY_SERVICE_CREDENTIALS_JSON:-}
      EVENTS_SERVICE_TOKEN: ${IDENTITY_EVENTS_SERVICE_TOKEN:-local-events-token}
      PURCHASES_SERVICE_TOKEN: ${IDENTITY_PURCHASES_SERVICE_TOKEN:-local-purchases-token}
    ports:
      - "${IDENTITY_HOST_PORT:-8002}:8000"
    volumes:
      - ./backend/identity-service:/app
      - identity-private-keys:/keys/private
      - identity-public-keys:/keys/public
    depends_on:
      identity-dev-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 5s
      retries: 10

  events-service:
    build:
      context: ./backend/events-service
    environment:
      DATABASE_URL: postgresql+psycopg://events:events@events-db:5432/events_db
    ports:
      - "8001:8000"
    volumes:
      - ./backend/events-service:/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      events-db:
        condition: service_healthy

volumes:
  postgres-data:
  events-db-data:
  identity-dev-db-data:
  identity-private-keys:
  identity-public-keys:
