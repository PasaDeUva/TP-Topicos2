name: CI

on:
  pull_request:
    branches:
      - development
      - master

permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test pull request target mapping
        run: python -m unittest discover -s .github/scripts -p "test_*.py"

      - name: Validate commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git log --no-merges --format=%s "${BASE_SHA}..${HEAD_SHA}" > "$RUNNER_TEMP/commit-subjects"
          while IFS= read -r subject; do
            python .github/scripts/validate_commit_message.py --subject "$subject"
          done < "$RUNNER_TEMP/commit-subjects"

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build application images
        run: docker compose build

      - name: Start test databases
        run: docker compose up -d --wait identity-dev-db events-db compras-db

      - name: Create Identity test database
        run: docker compose run --rm --no-deps identity-test-db-init

      - name: Migrate Identity test database
        run: docker compose run --rm --no-deps backend-tests sh -c 'cd identity-service && DATABASE_URL="$IDENTITY_TEST_DATABASE_URL" alembic upgrade head && DATABASE_URL="$IDENTITY_TEST_DATABASE_URL" alembic check'

      - name: Migrate events database
        run: docker compose run --rm events-service alembic upgrade head

      - name: Check database migration drift
        run: docker compose run --rm events-service alembic check

      - name: Migrate compras database
        run: docker compose run --rm compras-service alembic upgrade head

      - name: Check compras database migration drift
        run: docker compose run --rm compras-service alembic check

      - name: Lint backend
        run: docker compose run --rm --no-deps backend-tests python -m ruff check mock-service events-service identity-service compras-service

      - name: Test backend
        run: docker compose run --rm --no-deps backend-tests

      - name: Test Identity Compose integration
        run: python backend/identity-service/scripts/verify_compose.py

      - name: Test Compras Compose integration
        run: python backend/compras-service/scripts/verify_compose.py

      - name: Test Events Compose integration
        run: python backend/events-service/scripts/verify_compose.py

      - name: Lint frontend
        run: docker compose run --rm --no-deps mock-app npm run lint

      - name: Typecheck frontend
        run: docker compose run --rm --no-deps mock-app npm run typecheck

      - name: Test frontend
        run: docker compose run --rm --no-deps mock-app npm test

      - name: Lint web application
        run: docker compose run --rm --no-deps web-app npm run lint

      - name: Typecheck web application
        run: docker compose run --rm --no-deps web-app npm run typecheck

      - name: Test web application
        run: docker compose run --rm --no-deps web-app npm test

      - name: Build web application
        run: docker compose run --rm --no-deps web-app npm run build
